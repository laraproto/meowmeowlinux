on: [push]

jobs:
  build:
    runs-on: docker

    container:
      volumes:
        - /cache:/root/.cache/buildstream
    
    steps:
      - name: Setup Cache
        run: |
          mkdir -pv ~/.config
          cat << EOF > ~/.config/buildstream.conf
          artifacts:
            override-project-caches: true
            servers:
              - url: https://meowcache.laratheprotogen.dev:11002
                push: true
                connection-config:
                  keepalive-time: 60
                  retry-limit: 4
                  retry-delay: 500
                  request-timeout: 300
                auth:
                  access-token: ~/.config/buildstream.token

          source-caches:
            override-project-caches: true
            servers:
              - url: https://meowcache.laratheprotogen.dev:11002
                push: true
                connection-config:
                  keepalive-time: 60
                  retry-limit: 4
                  retry-delay: 500
                  request-timeout: 300
                auth:
                  access-token: ~/.config/buildstream.token
          EOF
          echo ${{ secrets.BUILDSTREAM_TOKEN }} > ~/.config/buildstream.token

      - name: Install Buildstream
        run: |
          apt update -y
          apt install pip bubblewrap lzip -y

          pip install buildstream --break-system-packages
          pip install dulwich requests tomlkit --break-system-packages                            

      - name: Checkout
        uses: actions/checkout@v6

      - name: Build Minimal
        run: |
          bst build groups/minimum.bst

#      - name: Build Base Target
#        run: |
#          bst build targets/base.bst
