# Unique project name
name: meowmeowlinux

# Required BuildStream version
min-version: 2.7

# Subdirectory where elements are stored
element-path: elements

ref-storage: project.refs

fatal-warnings:
  - overlaps
  - ref-not-in-track
  - unaliased-url

aliases:
  (@): include/aliases.yml

variables:
  bootstrap-prefix: /tools
  prefix: "%{bootstrap-prefix}"
  bootstrap-sysconfdir: "%{bootstrap-prefix}/etc"
  bootstrap-localstatedir: "%{bootstrap-prefix}/var"

  triplet: x86_64-meowmeow-linux-gnu
  bootstrap-sysroot: /sysroot

  sbindir: "%{bindir}"

  strip-binaries: ""

elements:
  autotools:
    variables:
      build-dir: "build"
      conf-root: "%{build-root}"
      configure: mkdir -p "%{build-dir}"; cd "%{build-dir}" && %{conf-cmd} %{conf-args}
      make: make -C "%{build-dir}" %{make-args}
      make-install: make -C "%{build-dir}" -j1 %{make-install-args}
      remove-libtool-modules: true
      remove-libtool-libraries: true


sources:
  gnu:
    config:
      mirror: "gnu-ftp:/gnu/"

plugins:
  - origin: junction
    junction: plugins/bst-plugins.bst
    elements:
      - meson
      - autotools
      - make
      - cmake
      - pip
      - setuptools
    sources:
      - patch
      - git
      - pip
  - origin: junction
    junction: plugins/bst-plugins-community.bst
    elements:
      - cargo
    sources:
      - ostree
      - git_tag
      - git_repo
      - patch_queue
      - pypi
  - origin: local
    path: plugins/
    sources:
      - gnu
