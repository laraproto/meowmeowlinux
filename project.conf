# Unique project name
name: meowmeowlinux

# Required BuildStream version
min-version: 2.7

# Subdirectory where elements are stored
element-path: elements

ref-storage: project.refs

fatal-warnings:
  - overlaps
  - ref-not-in-track
  - unaliased-url

aliases:
  (@): include/aliases.yml

variables:
  prefix: "/usr"
  sbindir: "%{bindir}"

  strip-binaries: ""

elements:
  autotools:
    variables:
      build-dir: "build"
      conf-root: "%{build-root}"
      configure: mkdir -p "%{build-dir}"; cd "%{build-dir}" && %{conf-cmd} %{conf-args}
      make: make -C "%{build-dir}" %{make-args}
      make-install: make -C "%{build-dir}" -j1 %{make-install-args}
      remove-libtool-modules: true
      remove-libtool-libraries: true

sources:
  gnu:
    config:
      mirror: "gnu-ftp:/gnu/"

artifacts:
  - url: https://meowcache.laratheprotogen.dev:11001
    connection-config:
      keepalive-time: 60
      retry-limit: 4
      retry-delay: 500
      request-timeout: 300

source-caches:
  - url: https://meowcache.laratheprotogen.dev:11001
    connection-config:
      keepalive-time: 60
      retry-limit: 4
      retry-delay: 500
      request-timeout: 300

plugins:
  - origin: junction
    junction: plugins/bst-plugins.bst
    elements:
      - meson
      - autotools
      - make
      - cmake
      - pip
      - setuptools
    sources:
      - patch
      - git
      - pip
      - cargo
  - origin: junction
    junction: plugins/bst-plugins-community.bst
    elements:
      - cargo
      - pyproject
    sources:
      - ostree
      - git_tag
      - git_repo
      - git_module
      - go_module
      - patch_queue
      - pypi
  - origin: local
    path: plugins/
    sources:
      - gnu
      - cargo2
