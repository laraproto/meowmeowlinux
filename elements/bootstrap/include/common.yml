variables:
  strip-binaries: ""
  tools: "%{bootstrap}/tools"
  bootstrap: "/bootstrap"
  prefix: "%{bootstrap}"

environment:
  _GCC_AUTOCONF_VERSION_CHECK: false
  PATH: "%{bootstrap}/bin:%{tools}/bin:%{install-root}/usr/bin:/usr/bin"
  LD_LIBRARY_PATH: "%{bootstrap}/lib:%{tools}/lib:%{install-root}/usr/lib:/usr/lib"
