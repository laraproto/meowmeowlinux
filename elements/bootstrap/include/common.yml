variables:
  strip-binaries: ""
  sysroot: "%{bootstrap-sysroot}"
  prefix: "/usr"
  gcc-version: 16.2.0 #$(%{triplet}-gcc -dumpversion)

environment:
  _GCC_AUTOCONF_VERSION_CHECK: false
  PATH: "%{bootstrap-prefix}/bin:/bin"
  LD_LIBRARY_PATH: "%{bootstrap-prefix}/lib:%{install-root}/usr/lib:/usr/lib"
