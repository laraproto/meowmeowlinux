[Partition]
Type=root
Label=MeowMeowLinux Live ISO
Format=erofs

CopyFiles=/usr
ExcludeFiles=/boot

SizeMinBytes=1.8G
SizeMaxBytes=1.8G

Compression=zstd
CompressionLevel=6

MakeDirectories=/dev /proc /sys /run /tmp /etc /var /root
MakeSymlinks=/bin:/usr/bin /sbin:/usr/bin /lib:/usr/lib /lib64:/usr/lib
