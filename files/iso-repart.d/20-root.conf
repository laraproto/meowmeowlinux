[Partition]
Type=root
Label=MeowMeowLinux Live ISO
Format=erofs

CopyFiles=/usr
ExcludeFiles=/boot

SizeMinBytes=4096M
SizeMaxBytes=4096M

Compression=zstd
CompressionLevel=6

MakeDirectories=/dev /proc /sys /run /tmp /etc /var /root /boot
MakeSymlinks=/bin:/usr/bin /sbin:/usr/bin /lib:/usr/lib /lib64:/usr/lib
